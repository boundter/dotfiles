# remap prefix from C-b to C-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes with | and _
bind | split-window -h -c '#{pane_current_path}'
bind _ split-window -v -c '#{pane_current_path}'
unbind '"'
unbind %

set-window-option -g mode-keys vi
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -i -f -selection primary | xclip -i -selection clipboard"

# switch panes with Alt+vim-keys
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-j select-pane -D
bind -n M-k select-pane -U

# activate mouse
set -g mouse on

# activate colors
set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

set -s escape-time 0

# forget the find window.  That is for chumps
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

bind-key -r r run-shell "~/.local/bin/tmux-sessionizer ~/code/tc/qsav/qsav"
bind-key -r t run-shell "~/.local/bin/tmux-sessionizer ~/code/tc/qsav/upa_tool"
bind-key -r y run-shell "~/.local/bin/tmux-sessionizer ~/code/personal/coding_exercises"
bind-key -r m run-shell "~/.local/bin/tmux-sessionizer ~/Documents/notes"

set -g @catppuccin_flavour 'macchiato'
set -g @catppuccin_window_status_style "rounded"

set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux' # or where this file is located on your machine

set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -agF status-right "#{E:@catppuccin_status_pomodoro_plus}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# list of installed plugins
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'olimorris/tmux-pomodoro-plus'
set -g @plugin 'tmux-plugins/tpm' # plugin-manager

set -g @pomodoro_sound 'on'
set -g @pomodoro_mins 1
set -g @pomodoro_notifications 'on'
set -g @pomodoro_granularity 'on'
set -g status-interval 2

run '$HOME/.tmux/plugins/tpm/tpm'
